{% load static %}

<section>

    <div class="container py-4">
        
        <h2 class="article-section-title">
            {{ title }}
        </h2>

        <div class="row g-4 article-carousel">

            {% for article in articles %}

            <div class="col-12 col-lg-4">

                <div class="article-card">

                    {% if article.image and article.image != "None" %}
                        <a href="{% url 'article_detail' %}?title={{ article.title|urlencode }}&description={{ article.description|urlencode }}&image={{ article.image|urlencode }}&published={{ article.published|urlencode }}&source={{ article.source|urlencode }}&url={{ article.url|urlencode }}">
                            <img
                                src="{% if article.image and article.image != 'None' %}{{ article.image }}{% else %}{% static 'images/placeholder.png' %}{% endif %}"
                                alt="{{ article.title }}"
                                data-fallback-src="{% static 'images/placeholder.png' %}"
                                onerror="this.onerror=null; this.src=this.dataset.fallback_src;"
                            >
                        </a>
                    {% endif %}

                    <a href="{% url 'article_detail' %}?title={{ article.title|urlencode }}&description={{ article.description|urlencode }}&image={{ article.image|urlencode }}&published={{ article.published|urlencode }}&source={{ article.source|urlencode }}&url={{ article.url|urlencode }}">
                        <h3>{{ article.title }}</h3>
                    </a>

                    <p>{{ article.description }}</p>

                    <small class="published-date">
                        {{ article.published }}
                    </small>

                    <a
                        href="{% url 'article_detail' %}?title={{ article.title|urlencode }}&description={{ article.description|urlencode }}&image={{ article.image|urlencode }}&published={{ article.published|urlencode }}&source={{ article.source|urlencode }}&url={{ article.url|urlencode }}"
                        class="btn btn-primary mt-auto"
                    >
                        View Details
                    </a>

                </div>

            </div>

            {% endfor %}

        </div>

    </div>

</section>
